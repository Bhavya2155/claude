<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gnan Mandir | Magazines</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white min-h-screen">

    <div id="grid-view" class="container mx-auto px-4 py-6 max-w-7xl">
        <header class="mb-10 border-b pb-4">
            <img src="logo.png" alt="Logo" class="h-10 mb-4 block">
            <h1 class="text-xl font-bold text-red-700 uppercase">Magazines</h1>
        </header>
        <div id="magazine-list"></div>
    </div>

    <!-- Modal View -->
    <div id="flipbook-view">
        <button id="close-flipbook" class="absolute top-6 right-6 text-white/50 text-4xl">✕</button>
        <div id="flipbook-wrapper"></div>
        <div class="mb-10 w-full flex justify-center z-[10001]">
            <div class="flex items-center gap-10">
                <button id="btn-prev" class="text-white font-bold uppercase text-xs tracking-widest">Prev</button>
                <span id="page-counter" class="text-white/30 font-mono text-xs">0 / 0</span>
                <button id="btn-next" class="bg-orange-600 text-white px-10 py-3 rounded font-bold text-xs uppercase">Next</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
